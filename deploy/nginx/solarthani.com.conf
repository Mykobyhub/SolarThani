# Reverse proxy: solarthani.com -> Next.js (PM2, port 3000)
# วางไฟล์นี้ที่ /etc/nginx/sites-available/solarthani.com แล้ว symlink เข้า sites-enabled
# หลังรัน `certbot --nginx` ไฟล์นี้จะถูกแก้อัตโนมัติให้เพิ่ม SSL server block + redirect HTTP->HTTPS
# (setup-vps.sh จัดการขั้นตอนนี้ให้แล้ว ไม่ต้องแก้เองตอนแรก)

server {
    listen 80;
    listen [::]:80;
    server_name solarthani.com www.solarthani.com;

    client_max_body_size 10M;

    # สำหรับ certbot webroot challenge (เผื่อใช้ --webroot แทน --nginx)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
