<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cells" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Frame shadow -->
  <rect x="9" y="13" width="62" height="46" rx="4" fill="#1e3a8a" opacity="0.12" transform="translate(2,3)"/>
  <!-- Frame -->
  <rect x="7" y="10" width="62" height="46" rx="4" fill="url(#frame)" filter="url(#sh)"/>
  <!-- Solar cells -->
  <rect x="12" y="15" width="52" height="36" rx="2.5" fill="url(#cells)"/>
  <!-- Grid vertical -->
  <line x1="30" y1="15" x2="30" y2="51" stroke="#1D4ED8" stroke-width="1" opacity="0.45"/>
  <line x1="48" y1="15" x2="48" y2="51" stroke="#1D4ED8" stroke-width="1" opacity="0.45"/>
  <!-- Grid horizontal -->
  <line x1="12" y1="27" x2="64" y2="27" stroke="#1D4ED8" stroke-width="1" opacity="0.45"/>
  <line x1="12" y1="39" x2="64" y2="39" stroke="#1D4ED8" stroke-width="1" opacity="0.45"/>
  <!-- Cell highlights -->
  <rect x="15" y="18" width="11" height="6" rx="1" fill="white" opacity="0.2"/>
  <rect x="33" y="18" width="11" height="6" rx="1" fill="white" opacity="0.1"/>
  <!-- Stand legs -->
  <line x1="30" y1="56" x2="27" y2="72" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="56" x2="49" y2="72" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <line x1="21" y1="72" x2="55" y2="72" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>

  <!-- Shield -->
  <path d="M71 33 L90 40 L90 65 Q90 82 71 90 Q52 82 52 65 L52 40 Z" fill="url(#shield)" filter="url(#sh)"/>
  <!-- Shield highlight -->
  <path d="M60 40 L70 43 L70 56 Q70 61 65 63 Q60 61 60 56 Z" fill="white" opacity="0.2"/>
  <!-- Checkmark -->
  <path d="M59 65 L67 72 L82 55" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
