<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="5%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Body shadow -->
  <rect x="4" y="4" width="58" height="74" rx="5" fill="#64748B" opacity="0.15" transform="translate(2,3)"/>
  <!-- Body -->
  <rect x="2" y="2" width="58" height="74" rx="5" fill="url(#body)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#sh)"/>
  <!-- Top accent stripe -->
  <rect x="2" y="2" width="58" height="6" rx="5" fill="#E2E8F0"/>
  <rect x="2" y="5" width="58" height="3" fill="#E2E8F0"/>
  <!-- Display screen -->
  <rect x="8" y="12" width="44" height="26" rx="3" fill="#1E293B"/>
  <!-- Screen glow -->
  <rect x="8" y="12" width="44" height="26" rx="3" fill="#0F172A" opacity="0.5"/>
  <!-- LED indicators -->
  <circle cx="14" cy="25" r="3.5" fill="#22C55E"/>
  <circle cx="14" cy="25" r="2" fill="#86EFAC"/>
  <circle cx="23" cy="25" r="3.5" fill="#F59E0B"/>
  <!-- Display lines -->
  <rect x="30" y="19" width="16" height="2.5" rx="1.25" fill="#475569"/>
  <rect x="30" y="24" width="11" height="2.5" rx="1.25" fill="#334155"/>
  <rect x="30" y="29" width="14" height="2.5" rx="1.25" fill="#334155" opacity="0.6"/>
  <!-- Vent lines -->
  <line x1="8" y1="44" x2="52" y2="44" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="8" y1="50" x2="52" y2="50" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="8" y1="56" x2="52" y2="56" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Cable ports -->
  <rect x="8" y="62" width="12" height="10" rx="2" fill="#475569"/>
  <rect x="24" y="62" width="12" height="10" rx="2" fill="#475569"/>
  <rect x="40" y="62" width="12" height="10" rx="2" fill="#475569"/>
  <!-- Port highlights -->
  <rect x="10" y="64" width="4" height="3" rx="1" fill="#64748B"/>
  <rect x="26" y="64" width="4" height="3" rx="1" fill="#64748B"/>
  <rect x="42" y="64" width="4" height="3" rx="1" fill="#64748B"/>
  <!-- Cables -->
  <line x1="14" y1="72" x2="14" y2="80" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="30" y1="72" x2="30" y2="80" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="72" x2="46" y2="80" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Shield -->
  <path d="M71 33 L90 40 L90 65 Q90 82 71 90 Q52 82 52 65 L52 40 Z" fill="url(#shield)" filter="url(#sh)"/>
  <!-- Shield highlight -->
  <path d="M60 40 L70 43 L70 56 Q70 61 65 63 Q60 61 60 56 Z" fill="white" opacity="0.2"/>
  <!-- Checkmark -->
  <path d="M59 65 L67 72 L82 55" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
