<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wrench" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="driver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <filter id="tsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Wrench handle (grey, bottom-left to upper-right) -->
  <path d="M6 66 L34 20" stroke="url(#wrench)" stroke-width="9" stroke-linecap="round" filter="url(#tsh)"/>
  <!-- Wrench head ring (outer) -->
  <circle cx="38" cy="15" r="14" fill="url(#wrench)" filter="url(#tsh)"/>
  <!-- Wrench head inner hole -->
  <circle cx="38" cy="15" r="8" fill="#F1F5F9"/>
  <!-- Wrench opening (toward handle) -->
  <rect x="30" y="22" width="16" height="10" fill="#F1F5F9" transform="rotate(-30 38 27)"/>
  <!-- Wrench head shine -->
  <path d="M30 8 Q38 4 46 8" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Screwdriver handle (blue, upper-left to lower-right) -->
  <path d="M5 8 L29 42" stroke="url(#driver)" stroke-width="13" stroke-linecap="round" filter="url(#tsh)"/>
  <!-- Screwdriver handle shine -->
  <path d="M8 10 L20 27" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  <!-- Screwdriver shaft (grey) -->
  <path d="M25 38 L45 62" stroke="#9CA3AF" stroke-width="7" stroke-linecap="round"/>
  <!-- Shaft highlight -->
  <path d="M27 40 L43 60" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Tip -->
  <path d="M43 59 L50 68" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>

  <!-- Shield -->
  <path d="M71 33 L90 40 L90 65 Q90 82 71 90 Q52 82 52 65 L52 40 Z" fill="url(#shield)" filter="url(#sh)"/>
  <!-- Shield highlight -->
  <path d="M60 40 L70 43 L70 56 Q70 61 65 63 Q60 61 60 56 Z" fill="white" opacity="0.2"/>
  <!-- Checkmark -->
  <path d="M59 65 L67 72 L82 55" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
